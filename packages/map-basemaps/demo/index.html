<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Sweety — стили карты</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #e9eef4;
      }
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #map {
        width: 100%;
        height: 100vh;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <script data-demo-guard data-demo-url="http://localhost:5173/packages/map-basemaps/demo/">
      (function () {
        var url = document.currentScript.getAttribute('data-demo-url');

        // Модуль демо вызывает этот хук последней строкой. Пока он не вызван,
        // страница считается не запустившейся — вместо пустой карты покажем причину.
        window.__sweetyDemoReady = function () {
          window.__sweetyDemoStarted = true;
        };

        function showFailure(title, message, command) {
          if (document.getElementById('demo-failure')) return;
          var overlay = document.createElement('div');
          overlay.id = 'demo-failure';
          overlay.setAttribute('role', 'alert');
          overlay.style.cssText =
            'position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:#0f172a;color:#e2e8f0;font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif;';
          overlay.innerHTML =
            '<div style="max-width:600px">' +
            '<h1 style="margin:0 0 10px;font-size:22px;line-height:1.25">' +
            title +
            '</h1>' +
            '<p style="margin:0 0 14px;color:#94a3b8">' +
            message +
            '</p>' +
            '<p style="margin:0 0 10px">Запустите dev-сервер в корне репозитория:</p>' +
            '<pre style="margin:0 0 16px;padding:12px 14px;border-radius:8px;background:#1e293b;color:#e2e8f0;overflow:auto">' +
            command +
            '</pre>' +
            '<p style="margin:0 0 16px">и откройте<br><a style="color:#38bdf8" href="' +
            url +
            '">' +
            url +
            '</a></p>' +
            '<p style="margin:0;color:#64748b;font-size:13px">Если сервер уже запущен, причина ошибки — в консоли браузера (F12) и в терминале Vite.</p>' +
            '</div>';
          document.documentElement.appendChild(overlay);
        }

        if (location.protocol === 'file:') {
          showFailure(
            'Демо открыто с диска',
            'Браузер блокирует ES-модули по file://, поэтому карта не запускается. Откройте демо через dev-сервер.',
            'npm run dev',
          );
          return;
        }

        window.addEventListener(
          'error',
          function (event) {
            if (window.__sweetyDemoStarted) return;
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') {
              showFailure(
                'Модуль демо не загрузился',
                'Dev-сервер вернул ошибку при загрузке скрипта — обычно это неразрешённый импорт.',
                'npm run dev',
              );
            }
          },
          true,
        );

        window.addEventListener('unhandledrejection', function () {
          if (!window.__sweetyDemoStarted) {
            showFailure(
              'Демо не запустилось',
              'При инициализации карты произошла ошибка.',
              'npm run dev',
            );
          }
        });

        setTimeout(function () {
          if (window.__sweetyDemoStarted) return;
          showFailure(
            'Демо не запустилось',
            'Модуль демо не выполнился за 8 секунд. Проверьте, что dev-сервер запущен и не показывает ошибок.',
            'npm run dev',
          );
        }, 8000);
      })();
    </script>

    <div id="map"></div>

    <script type="module">
      import { Map } from 'sweety-map';
      import { BasemapControl, basemaps } from '../src/index.js';

      const map = new Map('map', {
        center: [55.7558, 37.6173],
        zoom: 11,
      });

      // Одна строка — и у карты есть подложка с сохранением выбора.
      basemaps.install(map, {
        default: 'osm',
        persist: true,
        storageKey: 'sweety-demo-basemap',
        fallback: 'osm',
      });

      // Выбор стиля: короткий список бесплатных подложек с понятными названиями.
      new BasemapControl({
        position: 'topright',
        preview: true,
        previewCoords: { x: 2476, y: 1280, z: 12 },
        search: false,
        showCategories: false,
        providers: [
          'osm',
          'esri-light-gray',
          'esri-dark-gray',
          'esri-world-imagery',
          'esri-world-topo',
          'cyclosm',
          'osm-hot',
        ],
        labels: {
          osm: 'Улицы',
          'esri-light-gray': 'Светлая',
          'esri-dark-gray': 'Тёмная',
          'esri-world-imagery': 'Спутник',
          'esri-world-topo': 'Рельеф',
          cyclosm: 'Велосипедная',
          'osm-hot': 'Гуманитарная',
        },
        i18n: {
          title: 'Слои',
          close: 'Закрыть',
        },
      }).addTo(map);

      window.map = map;
      window.__sweetyDemoReady();
    </script>
  </body>
</html>
