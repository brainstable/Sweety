name: Сообщение об ошибке
description: Воспроизводимый дефект карты, слоя или контрола
title: 'bug: '
labels: ['bug', 'triage']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Пожалуйста, приложите минимальное воспроизведение.
        Не публикуйте секреты, токены и персональные данные.

  - type: input
    id: version
    attributes:
      label: Версия Sweety
      description: Из package.json, тега или `Sweety.version`
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Окружение
      description: ОС, браузер, Node.js, сборщик
      placeholder: Windows 11, Chrome 131, Node 22, Vite 8
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть examples/
        2. Добавить TileLayer с ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Текст ошибки, stack trace, скриншот
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Минимальное воспроизведение
      description: Ссылка на CodeSandbox/StackBlitz или небольшой HTML/JS
      render: html

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил существующие issues
          required: true
        - label: Я могу воспроизвести проблему на актуальной версии
          required: true
