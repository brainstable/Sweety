name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build ESM, UMD and CSS
        run: npm run build

      - name: Verify build artifacts
        run: npm run verify:build

      - name: Build docs and demos site
        run: npm run build:site

      - name: Check package contents
        run: npm pack --dry-run

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweety-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  edit-plugin:
    name: Edit plugin lint, test, size
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint plugin
        run: npx eslint packages/map-edit-plugin/src packages/map-edit-plugin/test packages/map-edit-plugin/scripts

      - name: Test plugin
        run: npm --prefix packages/map-edit-plugin run test

      - name: Build plugin (ESM, UMD, CSS)
        run: npm --prefix packages/map-edit-plugin run build

      - name: Check plugin bundle size
        run: npm --prefix packages/map-edit-plugin run size

      - name: Check plugin package contents
        run: npm pack ./packages/map-edit-plugin --dry-run

  basemaps:
    name: Basemaps lint, test, size
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint basemaps
        run: npx eslint packages/map-basemaps/src packages/map-basemaps/test packages/map-basemaps/scripts

      - name: Test basemaps
        run: npm --prefix packages/map-basemaps run test

      - name: Build basemaps (full + light, ESM/UMD/CSS)
        run: npm --prefix packages/map-basemaps run build

      - name: Check basemaps bundle size
        run: npm --prefix packages/map-basemaps run size

      - name: Check basemaps package contents
        run: npm pack ./packages/map-basemaps --dry-run

  demo-smoke:
    name: Demo smoke in headless browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run demo smoke test
        run: npm run smoke:demo
