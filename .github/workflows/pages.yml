name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публикация не должна отменять идущий деплой: иначе Pages остаётся на старой
# версии. Новые пуши выстраиваются в очередь.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs and demos
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Включает Pages с публикацией из Actions, если сайт ещё не настроен.
          enablement: true

      - name: Build docs and demos
        run: npm run build:site
        env:
          # Для страницы проекта это /Sweety/, для корневого домена — /.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
